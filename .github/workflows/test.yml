name: test

# Windows 自动测试闸门：覆盖浏览器调参工具与 render_pipeline。
#
# 边界（有意为之）：
# * 只在 windows-latest 上跑 —— 本工具只承诺 Windows；用其它平台跑等于承诺了不支持的平台。
# * 不依赖真实 Blender —— 测试自带假 MCP 服务器、假 bpy 桩与合成 PMX 占位文件，
#   真的执行服务端生成的代码。
# * 不上传任何产物 —— 不含模型、贴图、预览图、日志，避免仓库 Actions 里出现工程素材。
# * 真实 Blender / 真实浏览器验收仍是**人工**步骤，不进 GitHub Runner。
# * 两个 job 互相独立：pytest **不要求** Node，web **不要求** Python。
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      # 源码与测试里有大量中文；显式打开 UTF-8 模式，避免 Runner 默认代码页
      # 把断言失败信息里的中文打成 UnicodeEncodeError 而掩盖真正的失败原因。
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 运行 pytest
        run: python -m pytest

  # v4 前端（web/）的独立闸门。
  #
  # 为什么单独一个 job 而不是塞进 pytest：
  # * 两者依赖完全不同（Node vs Python），合并就要在每个 job 里都装两套工具链；
  # * 失败原因必须一眼可辨 —— Web 挂掉不能被 Python 的绿灯掩盖，反之亦然。
  # * **pytest 不依赖 Node**：dist/ 未构建时 /next 返回 503 的诊断本身有用例覆盖，
  #   因此 Python job 不需要 npm。
  #
  # 顺序刻意是 typecheck → build → test：`web/src/build/build.test.ts` 会断言 dist 的
  # 真实内容（唯一令牌占位、无令牌形态串、无 sourcemap），先构建才验得到东西。
  web:
    name: web (Node ${{ matrix.node-version }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22"]
    defaults:
      run:
        working-directory: web
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖（严格按 lockfile）
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 生产构建（含产物校验）
        run: npm run build

      - name: 单元测试
        run: npm run test
