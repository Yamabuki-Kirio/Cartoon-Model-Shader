name: test

# Windows 自动测试闸门：覆盖浏览器调参工具与 render_pipeline。
#
# 边界（有意为之）：
# * 只在 windows-latest 上跑 —— 本工具只承诺 Windows；用其它平台跑等于承诺了不支持的平台。
# * 不依赖真实 Blender —— 测试使用假 MCP、假 bpy 与合成 PMX 占位文件。
# * 不上传任何产物 —— 不含模型、贴图、预览图、日志，避免仓库 Actions 里出现工程素材。
# * 真实 Blender / 真实浏览器验收仍是**人工**步骤，不进 GitHub Runner。
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      # 源码与测试里有大量中文；显式打开 UTF-8 模式，避免 Runner 默认代码页
      # 把断言失败信息里的中文打成 UnicodeEncodeError 而掩盖真正的失败原因。
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 运行 pytest
        run: python -m pytest
